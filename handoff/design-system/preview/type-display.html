<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display & Heading Type" subtitle="Cinzel — Display, H1–H4" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--t-color-warm-100); font-family: var(--t-font-body); padding: 28px 32px; }
  .row { border-bottom: 1px solid var(--t-color-neutral-200); padding: 14px 0; display: flex; align-items: baseline; gap: 24px; }
  .row:last-child { border-bottom: none; }
  .meta { width: 90px; flex-shrink: 0; font-size: 9px; color: var(--t-color-warm-300); letter-spacing: var(--t-ls-ui); text-transform: uppercase; line-height: 1.5; }
  .specimen { font-family: var(--t-font-display); color: var(--t-color-brand-500); letter-spacing: var(--t-ls-button); text-transform: uppercase; line-height: 1.1; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">Display<br>68px / 400</div>
    <div class="specimen" style="font-size:42px; letter-spacing:0.28em;">Own The Moment</div>
  </div>
  <div class="row">
    <div class="meta">H1<br>52px / 400</div>
    <div class="specimen" style="font-size:32px; letter-spacing:0.2em;">Venix Concierge</div>
  </div>
  <div class="row">
    <div class="meta">H2<br>38px / 400</div>
    <div class="specimen" style="font-size:24px; letter-spacing:0.16em;">Luxury Services</div>
  </div>
  <div class="row">
    <div class="meta">H3<br>24px / 600</div>
    <div class="specimen" style="font-size:16px; font-weight:600; letter-spacing:0.12em;">Chauffeur & Transport</div>
  </div>
  <div class="row">
    <div class="meta">H4<br>20px / 600</div>
    <div class="specimen" style="font-size:13px; font-weight:600; letter-spacing:0.12em;">Private Air Travel</div>
  </div>
</body>
</html>
