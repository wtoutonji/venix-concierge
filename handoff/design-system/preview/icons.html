<!DOCTYPE html>
<!-- @dsCard group="Components" name="Iconography" subtitle="16 service icons on light + dark (Lucide substitution)" viewport="600x260" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--t-color-warm-100); font-family: var(--t-font-body); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; margin-bottom: 20px; }
  .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; }
  .icon-cell svg { color: var(--t-color-brand-500); }
  .icon-name { font-size: 7px; color: var(--t-color-warm-300); letter-spacing: 0.04em; text-align: center; line-height: 1.3; }
  .dark-bar { background: var(--t-color-brand-700); border-radius: var(--t-radius-card); padding: 14px; display: flex; gap: 16px; justify-content: center; }
  .dark-bar svg { color: var(--t-color-warm-200); }
  .sub { font-size: 8px; color: var(--t-color-warm-300); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="sub">Icons on light — Lucide (thin stroke substitution)</div>
  <div class="grid">
    <div class="icon-cell"><i data-lucide="plane" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Air Travel</div></div>
    <div class="icon-cell"><i data-lucide="car" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Chauffeur</div></div>
    <div class="icon-cell"><i data-lucide="anchor" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Yacht</div></div>
    <div class="icon-cell"><i data-lucide="building-2" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Hotel</div></div>
    <div class="icon-cell"><i data-lucide="star" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">VIP Events</div></div>
    <div class="icon-cell"><i data-lucide="shopping-bag" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Shopping</div></div>
    <div class="icon-cell"><i data-lucide="shield" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Security</div></div>
    <div class="icon-cell"><i data-lucide="phone" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">24/7 Support</div></div>
    <div class="icon-cell"><i data-lucide="globe" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Global</div></div>
    <div class="icon-cell"><i data-lucide="calendar" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Reservations</div></div>
    <div class="icon-cell"><i data-lucide="heart" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Lifestyle</div></div>
    <div class="icon-cell"><i data-lucide="lock" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Discretion</div></div>
    <div class="icon-cell"><i data-lucide="diamond" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Exclusive</div></div>
    <div class="icon-cell"><i data-lucide="map-pin" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Destination</div></div>
    <div class="icon-cell"><i data-lucide="user-check" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Personal</div></div>
    <div class="icon-cell"><i data-lucide="clock" width="22" height="22" stroke-width="1.3"></i><div class="icon-name">Punctual</div></div>
  </div>
  <div class="sub">Icons on dark</div>
  <div class="dark-bar">
    <i data-lucide="plane" width="22" height="22" stroke-width="1.3" style="color:var(--t-color-warm-200);"></i>
    <i data-lucide="car" width="22" height="22" stroke-width="1.3" style="color:var(--t-color-warm-200);"></i>
    <i data-lucide="anchor" width="22" height="22" stroke-width="1.3" style="color:var(--t-color-warm-200);"></i>
    <i data-lucide="star" width="22" height="22" stroke-width="1.3" style="color:var(--t-color-accent-500);"></i>
    <i data-lucide="shield" width="22" height="22" stroke-width="1.3" style="color:var(--t-color-warm-200);"></i>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
