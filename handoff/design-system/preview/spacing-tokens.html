<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing & Radius" subtitle="Space scale 4–64px, border radii 0–8px" viewport="500x240" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--t-color-warm-100); font-family: var(--t-font-body); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 16px; }
  .sp { background: var(--t-color-brand-500); border-radius: var(--t-radius-sm); }
  .labels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .lbl { font-size: 8px; color: var(--t-color-warm-300); letter-spacing: 0.04em; text-align: center; }
  .radii { display: flex; gap: 16px; margin-top: 20px; align-items: flex-end; }
  .radius-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .radius-box { width: 36px; height: 36px; background: var(--t-color-neutral-100); border: 1px solid var(--t-color-brand-500); }
  .radius-lbl { font-size: 8px; color: var(--t-color-warm-300); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sp" style="height:4px;"></div>
    <div class="sp" style="height:8px;"></div>
    <div class="sp" style="height:12px;"></div>
    <div class="sp" style="height:16px;"></div>
    <div class="sp" style="height:24px;"></div>
    <div class="sp" style="height:32px;"></div>
    <div class="sp" style="height:48px;"></div>
    <div class="sp" style="height:64px;"></div>
  </div>
  <div class="labels">
    <div class="lbl">4</div><div class="lbl">8</div><div class="lbl">12</div>
    <div class="lbl">16</div><div class="lbl">24</div><div class="lbl">32</div>
    <div class="lbl">48</div><div class="lbl">64</div>
  </div>
  <div class="radii">
    <div class="radius-item"><div class="radius-box" style="border-radius:0px;"></div><div class="radius-lbl">0px<br>None</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:2px;"></div><div class="radius-lbl">2px<br>sm</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:4px;"></div><div class="radius-lbl">4px<br>md</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:8px;"></div><div class="radius-lbl">8px<br>lg (media)</div></div>
  </div>
</body>
</html>
