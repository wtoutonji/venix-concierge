<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral Colors" subtitle="Taupe, Champagne, Ivory, Blush, Mist, Pearl" viewport="600x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--t-color-warm-100); font-family: var(--t-font-body); padding: 24px; }
  .swatches { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: var(--t-radius-card); overflow: hidden; }
  .swatch-color { height: 80px; border: 1px solid var(--t-color-neutral-200); }
  .swatch-info { padding: 8px 0 0; }
  .swatch-name { font-family: var(--t-font-display); font-size: 9px; letter-spacing: var(--t-ls-subhead); text-transform: uppercase; color: var(--t-color-brand-ink); margin-bottom: 2px; }
  .swatch-hex { font-size: 10px; color: var(--t-color-brand-500); letter-spacing: var(--t-ls-ui); }
  .swatch-role { font-size: 9px; color: var(--t-color-warm-300); margin-top: 2px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch">
    <div class="swatch-color" style="background:var(--t-color-warm-300);"></div>
    <div class="swatch-info">
      <div class="swatch-name">Taupe</div>
      <div class="swatch-hex">#C8B6A6</div>
      <div class="swatch-role">Warm Neutral</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:var(--t-color-warm-200);"></div>
    <div class="swatch-info">
      <div class="swatch-name">Champagne</div>
      <div class="swatch-hex">#E6D8C7</div>
      <div class="swatch-role">Light Warm</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:var(--t-color-warm-100);"></div>
    <div class="swatch-info">
      <div class="swatch-name">Ivory</div>
      <div class="swatch-hex">#FAFBF9</div>
      <div class="swatch-role">Page BG</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:var(--t-color-neutral-100);"></div>
    <div class="swatch-info">
      <div class="swatch-name">Blush</div>
      <div class="swatch-hex">#F6ECEF</div>
      <div class="swatch-role">Subtle Tint</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:var(--t-color-neutral-200);"></div>
    <div class="swatch-info">
      <div class="swatch-name">Mist</div>
      <div class="swatch-hex">#EDE6E8</div>
      <div class="swatch-role">Dividers</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:var(--t-color-neutral-50);"></div>
    <div class="swatch-info">
      <div class="swatch-name">Pearl</div>
      <div class="swatch-hex">#FBF5F6</div>
      <div class="swatch-role">Card Surface</div>
    </div>
  </div>
</div>
</body>
</html>
